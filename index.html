<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="index-BXtpOjFc.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="index-D6tZokQs.js"></script>
  <script>
    // Background Slideshow Handler
    (function() {
      'use strict';
      
      const SLIDESHOW_INTERVAL = 20000; // 20 seconds
      const FADE_DURATION = 1000; // 1 second
      
      // Background image paths
      const backgroundPaths = [
        './bg1.jpg',
        './bg2.jpg',
        './bg3.jpg',
        './bg4.jpg',
        './bg5.jpg',
        './bg6.jpg',
        './bg7.jpg',
        './bg8.jpg',
        './bg9.jpg',
        './bg10.jpg'
      ];
      
      let availableBackgrounds = [];
      let currentIndex = 0;
      let bgLayer1, bgLayer2;
      let isLayer1Active = true;
      let initialized = false;
      
      // Check which backgrounds are available (silently)
      async function checkAvailableBackgrounds() {
        const promises = backgroundPaths.map(path => {
          return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve(path);
            img.onerror = () => resolve(null);
            img.src = path;
            // Set timeout to avoid hanging
            setTimeout(() => resolve(null), 3000);
          });
        });
        
        const results = await Promise.all(promises);
        availableBackgrounds = results.filter(path => path !== null);
        
        return availableBackgrounds;
      }
      
      // Initialize slideshow
      async function initSlideshow() {
        if (initialized) return;
        
        try {
          // Wait for DOM to be ready
          if (document.readyState === 'loading') {
            await new Promise(resolve => {
              document.addEventListener('DOMContentLoaded', resolve);
            });
          }
          
          // Wait for React to render
          await new Promise(resolve => setTimeout(resolve, 1000));
          
          // Find the background container
          const container = document.querySelector('.relative.min-h-screen.w-full.overflow-hidden');
          if (!container) {
            return; // Silently fail if container not found
          }
          
          // Check available backgrounds
          await checkAvailableBackgrounds();
          
          if (availableBackgrounds.length <= 1) {
            return; // Not enough backgrounds for slideshow
          }
          
          // Find existing background layer
          const existingBg = container.querySelector('.fixed.inset-0.z-0');
          if (!existingBg) {
            return; // Silently fail if background not found
          }
          
          // Mark as initialized
          initialized = true;
          
          // Set up first background
          bgLayer1 = existingBg;
          bgLayer1.style.transition = `opacity ${FADE_DURATION}ms ease-in-out`;
          bgLayer1.style.backgroundImage = `url(${availableBackgrounds[0]})`;
          bgLayer1.style.willChange = 'opacity';
          
          // Create second layer for crossfade
          bgLayer2 = document.createElement('div');
          bgLayer2.className = existingBg.className;
          bgLayer2.style.cssText = existingBg.style.cssText;
          bgLayer2.style.opacity = '0';
          bgLayer2.style.transition = `opacity ${FADE_DURATION}ms ease-in-out`;
          bgLayer2.style.backgroundImage = `url(${availableBackgrounds[1] || availableBackgrounds[0]})`;
          bgLayer2.style.willChange = 'opacity';
          
          // Insert second layer after first
          existingBg.parentNode.insertBefore(bgLayer2, existingBg.nextSibling);
          
          // Start slideshow
          startSlideshow();
        } catch (error) {
          console.error('Slideshow initialization error:', error);
        }
      }
      
      function startSlideshow() {
        setInterval(() => {
          if (!bgLayer1 || !bgLayer2 || !initialized) return;
          
          try {
            currentIndex = (currentIndex + 1) % availableBackgrounds.length;
            const nextBg = availableBackgrounds[currentIndex];
            
            if (isLayer1Active) {
              // Fade to layer 2
              bgLayer2.style.backgroundImage = `url(${nextBg})`;
              bgLayer1.style.opacity = '0';
              bgLayer2.style.opacity = '1';
            } else {
              // Fade to layer 1
              bgLayer1.style.backgroundImage = `url(${nextBg})`;
              bgLayer2.style.opacity = '0';
              bgLayer1.style.opacity = '1';
            }
            
            isLayer1Active = !isLayer1Active;
          } catch (error) {
            console.error('Slideshow transition error:', error);
          }
        }, SLIDESHOW_INTERVAL);
      }
      
      // Start when page loads
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSlideshow);
      } else {
        initSlideshow();
      }
    })();
  </script>
</body>
</html>
